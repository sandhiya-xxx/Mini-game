<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil: GitHub Outbreak</title>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            background: #000; 
            color: #39ff14; 
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        h1 { color: #ff3333; margin: 5px 0; text-shadow: 0 0 10px rgba(255,0,0,0.8); }
        .hud { display: flex; justify-content: space-around; width: 600px; margin: 0 auto 10px auto; background: rgba(0,20,0,0.8); padding: 10px; border: 1px solid #39ff14; }
        /* The actual retro game viewport monitor screen */
        #gameCanvas {
            background: #111;
            border: 4px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
        }
        .controls { color: #888; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>BIOHAZARD: COGNITIVE PROTOCOL</h1>

    <!-- Game Resource Monitor Displays -->
    <div class="hud">
        <div>VITAL SIGNS: <span id="playerStatus" style="color: #39ff14; font-weight: bold;">FINE</span></div>
        <div>SCORE TIME: <span id="gameScore" style="color: #fff;">0</span>s</div>
        <div>THREAT LEVEL: <span style="color: #ff3333; font-weight: bold;">CRITICAL</span></div>
    </div>

    <!-- The Actual Interactive Gameplay Screen Render Canvas Grid -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls">
        🏃 CONTROL LOGIC: Use <b>ARROW KEYS</b> or <b>WASD</b> on your keyboard to navigate Leon away from Nemesis!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game Memory Engine Coordinates Mapping Configuration Variables
        let score = 0;
        let gameOver = false;

        const player = {
            x: 100,
            y: 200,
            size: 15,
            speed: 4,
            color: "#00a2ff" // Blue pixel represent Leon S. Kennedy
        };

        const nemesis = {
            x: 500,
            y: 200,
            size: 22,
            speed: 1.8,
            color: "#ff3333" // Big angry red monster box tracking player coordinates
        };

        // Standard Keyboard Input Handling Matrices Array Map
        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        // Core Real-Time Gameplay Logic Calculation Loop Engine
        function updateGameMechanics() {
            if (gameOver) return;

            // Process Player Horizontal / Vertical Grid Traversal Coordinates
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.y -= player.speed;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.y += player.speed;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed;

            // Enforce Hard Screen Boundary Containment Logic Locks
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // Basic Tracking AI: Nemesis slowly calculates angle and moves toward Player
            if (nemesis.x < player.x) nemesis.x += nemesis.speed;
            if (nemesis.x > player.x) nemesis.x -= nemesis.speed;
            if (nemesis.y < player.y) nemesis.y += nemesis.speed;
            if (nemesis.y > player.y) nemesis.y -= nemesis.speed;

            // Increment Operational Challenge Survival Points
            score += 1;
            document.getElementById("gameScore").innerText = Math.floor(score / 60);

            // Pathfinding Raycast Distance Check Collision Evaluation Loop
            const dx = player.x - nemesis.x;
            const dy = player.y - nemesis.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Threat level indicators based on distance
            if (distance < 100) {
                document.getElementById("playerStatus").innerText = "DANGER";
                document.getElementById("playerStatus").style.color = "#ff3333";
            } else if (distance < 220) {
                document.getElementById("playerStatus").innerText = "CAUTION";
                document.getElementById("playerStatus").style.color = "#ffcc00";
            } else {
                document.getElementById("playerStatus").innerText = "FINE";
                document.getElementById("playerStatus").style.color = "#39ff14";
            }

            // Hitbox Overlap Collision Condition Check
            if (distance < (player.size + nemesis.size)) {
                gameOver = true;
                document.getElementById("playerStatus").innerText = "DECEASED";
            }
        }

        // Hardware Screen Refresh Synchronization Draw Pipeline 
        function renderGraphicsDisplay() {
            // Flash clear screen buffer canvas block
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Subtle Tactical Floor Grid Pattern background layout
            ctx.strokeStyle = "rgba(57, 255, 20, 0.05)";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // Draw Player Entity Component Node (Leon)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            // Draw Enemy Tracking Entity Node (Nemesis Boss)
            ctx.fillStyle = nemesis.color;
            ctx.fillRect(nemesis.x - nemesis.size, nemesis.y - nemesis.size, nemesis.size * 2, nemesis.size * 2);
            ctx.strokeStyle = "#ff0000";
            ctx.strokeRect(nemesis.x - nemesis.size, nemesis.y - nemesis.size, nemesis.size * 2, nemesis.size * 2);

            // Handle Render Layer State Interruption for Game Over Events
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff0000";
                ctx.font = "bold 40px 'Courier New'";
                ctx.fillText("YOU DIED", canvas.width/2 - 100, canvas.height/2);
                
                ctx.fillStyle = "#fff";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Refresh browser page to restart systemic sequence.", canvas.width/2 - 220, canvas.height/2 + 40);
                return;
            }

            // Request next frame array loop draw execution cycle
            requestAnimationFrame(gameLoopExecutionCycle);
        }

        // Standard Orchestration Game Loop Structure Pattern Execution Module
        function gameLoopExecutionCycle() {
            updateGameMechanics();
            renderGraphicsDisplay();
        }

        // Boot system pipeline
        gameLoopExecutionCycle();
    </script>
</body>
</html>
