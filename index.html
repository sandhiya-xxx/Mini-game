<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbrella Bio-Data Archive</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: linear-gradient(135deg, #050a05 0%, #0c180c 100%); 
            color: #39ff14; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 40px 20px;
            letter-spacing: 1px;
        }

        .game-banner {
            text-align: center;
            border-bottom: 2px dashed #ff0000;
            padding-bottom: 30px;
            margin-bottom: 40px;
            animation: radarPulse 4s infinite alternate;
        }

        h1 { font-size: 2.5rem; margin: 0; color: #ff3333; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .subtitle { font-size: 0.9rem; color: #39ff14; font-weight: bold; margin-top: 10px; }

        .utility-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(10, 30, 10, 0.7);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #39ff14;
        }

        .search-container input {
            width: 320px;
            padding: 12px 20px;
            background: #000;
            border: 1px solid #39ff14;
            color: #39ff14;
            border-radius: 2px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }
        .search-container input:focus { box-shadow: 0 0 15px rgba(57, 255, 20, 0.5); }

        .audio-btn {
            background: #ff3333;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
        }
        .audio-btn:hover { background: #ff6666; }

        #subject-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .subject-card { 
            background: rgba(0, 0, 0, 0.8); 
            padding: 25px; 
            border-radius: 4px; 
            border: 1px solid rgba(57, 255, 20, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }
        .subject-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            border-color: #ff3333;
        }

        .subject-card h3 { color: #fff; margin-top: 0; font-size: 1.4rem; border-bottom: 1px dashed #39ff14; padding-bottom: 10px; }
        .role { color: #ffcc00; font-weight: bold; font-size: 0.9rem; margin: 5px 0; }
        .faction { color: #ff3333; font-size: 0.85em; text-transform: uppercase; font-weight: bold; margin-bottom: 15px; }
        p { color: #a5d6a7; line-height: 1.5; font-size: 0.9rem; }

        @keyframes radarPulse {
            0% { border-color: #ff0000; }
            100% { border-color: #39ff14; }
        }
    </style>
</head>
<body>

    <div class="game-banner">
        <h1>UMBRELLA CORP. NETWORK</h1>
        <div class="subtitle">⚠️ WARNING: BIOHAZARD DATA LEAK // FILE ACCESS RESTRICTED ⚠️</div>
    </div>

    <div class="utility-bar">
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search Database (Name/Faction)...">
        </div>
        <div>
            <button class="audio-btn" id="audioToggle">Siren Audio: OFF</button>
        </div>
    </div>

    <div id="subject-list">Analyzing core memory channels...</div>

    <!-- Retro atmospheric music link for full simulation theme -->
    <audio id="bgm" loop src="https://soundhelix.com"></audio>

    <script>
        let allSubjects = [];

        fetch('outbreak_files.json')
            .then(response => response.json())
            .then(data => {
                allSubjects = data.subjects;
                displaySubjects(allSubjects);
            })
            .catch(error => {
                console.error('Terminal Link failure:', error);
                document.getElementById('subject-list').innerText = 'CRITICAL ERROR: Connection to mainframe dropped.';
            });

        function displaySubjects(subjects) {
            const listContainer = document.getElementById('subject-list');
            listContainer.innerHTML = ''; 

            if(subjects.length === 0) {
                listContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ff3333;">NO DATA RECORDS FOUND IN ARCHIVE INTERFACES.</p>';
                return;
            }

            subjects.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                    <h3>${sub.name}</h3>
                    <p class="role">☣️ Role: ${sub.role}</p>
                    <p class="faction">🚨 Target Faction: ${sub.faction}</p>
                    <p>${sub.bio}</p>
                `;
                listContainer.appendChild(card);
            });
        }

        document.getElementById('searchBar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSubjects.filter(sub => 
                sub.name.toLowerCase().includes(query) || 
                sub.faction.toLowerCase().includes(query)
            );
            displaySubjects(filtered);
        });

        const bgm = document.getElementById('bgm');
        const audioBtn = document.getElementById('audioToggle');
        audioBtn.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play().catch(err => console.log("Audio initialization override applied."));
                audioBtn.innerText = "Siren Audio: ON";
                audioBtn.style.background = "#39ff14";
            } else {
                bgm.pause();
                audioBtn.innerText = "Siren Audio: OFF";
                audioBtn.style.background = "#ff3333";
            }
        });
    </script>
</body>
</html>
